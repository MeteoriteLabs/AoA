services:
  paperclip:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AOA_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      AOA_HOME: "/paperclip"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AOA_DEPLOYMENT_MODE: "authenticated"
      AOA_DEPLOYMENT_EXPOSURE: "private"
      AOA_PUBLIC_URL: "${AOA_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      # Default host bind path. Existing users with data under ./data/docker-paperclip
      # should either set AOA_DATA_DIR=./data/docker-paperclip or rename that dir to ./data/docker-aoa.
      - "${AOA_DATA_DIR:-./data/docker-aoa}:/paperclip"
