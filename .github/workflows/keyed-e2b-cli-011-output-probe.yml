name: Keyed E2B — CLI-011 P-011 output probe

# CLI-011's LIVE lane: P-011, the `files.read` probe ruling F7 (the output mechanism) waits
# on. The design is `docs/replatform/epics/E7-coding-e2b/tickets/CLI-011-review.md` §10;
# this workflow and its test are the apparatus §10.2 says no existing lane can provide.
#
#   P-011a (shell only, NO model tokens) — S-P0..S-P7 in one sandbox on the resolved
#     template: is R (`/home/user/aoa-output`) template-empty; is the staged set disjoint
#     from R; what the real `files.list` returns (depth, type, size, symlinkTarget); does a
#     file survive a non-zero exit; does an unwritable redirect fail closed; does
#     `files.read` follow a symlink; does an env secret reach a file's bytes.
#   P-011b (claude, model tokens) — A-neg / A-dir / A-cwd / A-decl, each in a FRESH sandbox,
#     running the EXACT shipped claude literal (`buildSandboxInvocation`): what the CLI
#     writes by itself, and whether the agent places a deliverable under R.
#
# Every row of §10.5's decision table is evaluated and written into the durable record as
# `fired: true | false | "undecidable"` with the facts it read. Three positive controls
# (PC-1, PC-2, C-census) each expect the NEGATIVE outcome; if one does not produce it the
# apparatus cannot distinguish, and the lane reds as inconclusive.
#
# ★★★ IT RUNS ONLY ON DISPATCH. §3.7 of the review measured that a path-filtered push trigger
# (keyed-e2b-unit-d.yml) spends E2B money on merge with nobody deciding to. This lane spends E2B
# time AND Anthropic tokens, so it runs only when an operator dispatches it.
#
# ★★ THE `push` TRIGGER BELOW ONLY REGISTERS THE LANE (E6-D001's shape, applied to CLI-011 by the
# planning session under F2). A `workflow_dispatch`-only file that is not on the default branch
# answers HTTP 404 to `gh workflow run` until it has run once (measured on this lane, 2026-09-21),
# and `main` may not change before M5. So: the push's only path is THIS FILE (no code change can
# ever fire it), and EVERY job is gated `if: github.event_name == 'workflow_dispatch'`, so a
# push-created run executes zero steps and reads zero secrets. `evaluateWorkflowShape`
# (scripts/lib/cli-011-output-probe.mjs), run in the required `policy` job, reds on any
# deviation: a push without the paths restriction, extra paths, another branch or filter, a job
# without the gate, or any other trigger.
#
# HOW TO FIRE IT (the planning session, after merge — authorised under ruling F8, "the
# CLI-011 files.read probe"; record the candidate sha in the dispatch note):
#
#     gh workflow run keyed-e2b-cli-011-output-probe.yml --ref docs/replatform-program -f e2b_template=aoa-base -f arms=all
#
# `-f arms=shell-only` runs P-011a alone and spends NO model tokens.
#
# ★ `-f arms=a-neg-only` runs P-011a PLUS `A-neg` and its `C-census` control, and nothing else:
#   exactly ONE model turn. That is the pre-`M1b` re-run founder ruling F8 authorizes
#   (`docs/replatform/epics/E7-coding-e2b/decisions.md`, `E7-D11`). Added 2026-09-23 because the
#   authorization was not dispatchable before it: `all` spends four turns and `shell-only` omits
#   `A-neg` entirely (Codex P2, PR #575). It keeps the shell arms because they cost no model tokens
#   and the campaign precondition needs `S-P0` as well as `A-neg`, so ONE dispatch collects both;
#   and it keeps `C-census` because that is `A-neg`'s POSITIVE CONTROL, a shell write in the same
#   sandbox — an `A-neg` null result with no control proves nothing.
#
# SECRETS. `E2B_API_KEY` and `ANTHROPIC_API_KEY` only — codex is excluded (E7-D04), so no
# `OPENAI_API_KEY`. Each is bound to an env var and never interpolated into a script. The
# model key reaches the sandbox as a per-command env var; no key is written into a file. The
# S-P7 canary is a synthetic nonce, not a key. Every string the test emits is redacted.
#
# CLEANUP. Every sandbox is created inside a helper whose `finally` terminates it, on every
# path (a throw, a timeout, a red assertion). Sandbox TTLs are short as a second fence.

on:
  workflow_dispatch:
    inputs:
      e2b_template:
        # Empty = "aoa-base", the CLI-bearing template — NOT bare "base" (E7-F022). The
        # resolution is W7U1's `resolveTemplate`, reused.
        description: 'E2B sandbox template alias. Empty = "aoa-base" (the CLI-bearing template), NOT bare "base".'
        required: false
        default: ""
        type: string
      arms:
        description: '"all" = P-011a + P-011b, FOUR model turns. "shell-only" = P-011a only, no model tokens. "a-neg-only" = P-011a + A-neg + its C-census control, ONE model turn — the pre-M1b re-run ruling F8 authorizes.'
        required: false
        default: all
        type: choice
        options:
          - all
          - shell-only
          - a-neg-only
  push:
    branches: [docs/replatform-program]
    paths: [".github/workflows/keyed-e2b-cli-011-output-probe.yml"]

permissions:
  contents: read

concurrency:
  group: keyed-e2b-cli-011-output-probe
  cancel-in-progress: false

jobs:
  probe:
    # E6-D001: a push-created (registration) run skips this job — zero steps, zero secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLI011_RECORD_PATH: ${{ github.workspace }}/cli-011-record/cli-011-output-probe-record.json
      # The shell fallback's copy of the default template. Pinned to the pure core's
      # `resolveTemplate` by `evaluateWorkflowShape` in the required `policy` job.
      CLI011_DEFAULT_TEMPLATE: aoa-base
    # §10.2. One shell sandbox plus four short claude sandboxes (each agent turn capped at
    # 180 s). The in-test budget is 40 minutes; this cap sits outside it.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist-only leaves
        # Mirrors the proven block in keyed-e2b-dat-009-export.yml: the provider (used by
        # S-P3/S-P7) imports these workspace packages.
        run: |
          pnpm --filter @armyofagents/worker-protocol build
          pnpm --filter @armyofagents/worker-daemon build
          pnpm --filter @armyofagents/sandbox-fake-provider build
          pnpm --filter @armyofagents/sandbox-provider-contract build

      - name: Run the CLI-011 P-011 probe against REAL E2B
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          E2B_TEMPLATE: ${{ inputs.e2b_template }}
          CLI011_ARMS: ${{ inputs.arms }}
          CLI011_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm --filter @armyofagents/sandbox-e2b-provider exec vitest run src/__tests__/keyed-cli-011-output-probe.test.ts

      - name: Durable record — guarantee one exists, and put it on the run page
        # `always()` is load-bearing: the run that most needs a record is the one that
        # died before the test reached its own reporting stage (E7-F025: "fired and
        # unrecorded"). The test writes the real record; this writes a stub only if none exists.
        if: always()
        env:
          E2B_TEMPLATE_INPUT: ${{ inputs.e2b_template }}
          ARMS_INPUT: ${{ inputs.arms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          mkdir -p "$(dirname "$CLI011_RECORD_PATH")"
          if [ ! -s "$CLI011_RECORD_PATH" ]; then
            # Resolve exactly as `resolveTemplate` does: TRIM first, and an empty value means the
            # CLI-bearing default. A whitespace-only input must not be recorded as an explicit
            # template the probe never used (Codex review, PR #551).
            RESOLVED_TEMPLATE="$(RAW="${E2B_TEMPLATE_INPUT:-}" python3 -c 'import os;print(os.environ["RAW"].strip())')"
            RESOLVED_SOURCE="explicit"
            if [ -z "$RESOLVED_TEMPLATE" ]; then
              RESOLVED_TEMPLATE="$CLI011_DEFAULT_TEMPLATE"
              RESOLVED_SOURCE="default-cli-bearing"
            fi
            # The operator inputs are JSON-ENCODED before they enter the heredoc: a template
            # alias carrying `"` or a newline must not turn the fallback record into invalid
            # JSON (Codex review, PR #551). python3 is on every ubuntu-latest image.
            export RESOLVED_TEMPLATE
            ARMS_VALUE="${ARMS_INPUT:-all}"
            export ARMS_VALUE
            TEMPLATE_JSON="$(python3 -c 'import json,os;print(json.dumps(os.environ["RESOLVED_TEMPLATE"]))')"
            ARMS_JSON="$(python3 -c 'import json,os;print(json.dumps(os.environ["ARMS_VALUE"]))')"
            cat > "$CLI011_RECORD_PATH" <<EOF
          {
            "schema": "aoa.cli-011.output-probe-record/1",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commitSha": "${GITHUB_SHA}",
            "workflowRunUrl": "${RUN_URL}",
            "runNonce": "unknown",
            "template": { "resolved": ${TEMPLATE_JSON}, "source": "${RESOLVED_SOURCE}" },
            "armsMode": ${ARMS_JSON},
            "disposition": { "disposition": "inconclusive", "detail": "the probe produced NO record: it did not reach its reporting stage. Read the job log for the failing step." },
            "controls": [],
            "decisionTable": [],
            "verdicts": []
          }
          EOF
            {
              echo "### CLI-011 P-011 output probe — NO RESULT"
              echo
              echo "The probe did not reach its reporting stage, so no arm verdict exists."
              echo "Resolved template: \`${RESOLVED_TEMPLATE}\` (${RESOLVED_SOURCE}). Commit: \`${GITHUB_SHA}\`."
              echo
              echo "This run is NOT a measurement (§10.5, last row). Re-dispatch after fixing the failing step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Durable record at $CLI011_RECORD_PATH:"
          cat "$CLI011_RECORD_PATH"

      - name: Upload the durable CLI-011 probe record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-011-output-probe-record
          path: ${{ env.CLI011_RECORD_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Fail if the probe SKIPPED (a skip is not a measurement)
        # `describe.skip` without a key is a GREEN vitest run. The Anthropic key needs no
        # equivalent guard: without it every claude arm is `inconclusive` and the test reds.
        if: always()
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "::error::E2B_API_KEY was empty — the CLI-011 probe SKIPPED and measured NOTHING."
            exit 1
          fi
          echo "E2B_API_KEY was present; the probe ran for real. Read the job summary for the decision table."
