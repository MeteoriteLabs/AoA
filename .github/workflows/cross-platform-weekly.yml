name: Cross-platform weekly

on:
  schedule:
    # Sundays at 06:00 UTC (11:30 Asia/Kolkata).
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Advisory portability coverage. Linux remains the required PR platform.
  verify-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  # Cross-platform E2E suite. macOS uses embedded-postgres; Windows uses
  # an external PostgreSQL runner service via setup-postgres.
  e2e-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # F5 (PR#319 review): replaced the non-existent `database-ci/setup-postgres@v1`
      # (which would fail this step) with the maintained cross-platform action, pinned
      # to a commit SHA to match this repo's action-pinning convention.
      - name: Setup PostgreSQL (Windows)
        id: setup-postgres
        if: matrix.os == 'windows-latest'
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: postgres
          password: postgres
          database: aoa
          port: '5432'
          postgres-version: '16'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pin marketplace catalog fixture for stable e2e
        shell: bash
        run: cp tests/e2e/fixtures/marketplace-catalog.json ui/src/aoa-marketplace-snapshot.json

      - name: Install Playwright
        id: install-playwright
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install --only-shell chromium

      - name: Generate AoA config
        if: steps.install-playwright.outcome == 'success'
        shell: bash
        run: |
          mkdir -p ~/.aoa/instances/default
          cat > ~/.aoa/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      # F5 (PR#319 review): export DATABASE_URL from the action's connection-uri on
      # Windows ONLY. The previous step-level `${{ … || '' }}` set a present-but-empty
      # DATABASE_URL on the macOS lane, which config.ts reads with `??` (empty string
      # survives) — a latent break. Windows-only $GITHUB_ENV keeps non-Windows unset so
      # embedded-postgres is used there.
      - name: Export DATABASE_URL (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "DATABASE_URL=${{ steps.setup-postgres.outputs.connection-uri }}" >> "$GITHUB_ENV"

      - name: Run e2e tests
        if: steps.install-playwright.outcome == 'success'
        env:
          AOA_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: steps.install-playwright.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
