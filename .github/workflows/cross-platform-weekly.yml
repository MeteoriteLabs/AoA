name: Cross-platform weekly

on:
  schedule:
    # Sundays at 06:00 UTC (11:30 Asia/Kolkata).
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# ★★★ THE REQUIRED LANE SETS THIS AND THIS LANE DID NOT, WHICH IS THE WHOLE DIFFERENCE.
# Measured on run 35530583783: `server typecheck` died on macOS with
# `FATAL ERROR: Ineffective mark-compacts near heap limit - JavaScript heap out of memory`,
# a V8 crash rather than a type error. `pr.yml:11` carries a workflow-level
# `NODE_OPTIONS: --max-old-space-size=8192`; this file carried none, so the same tsc run that
# passes on the required lane exhausted the default heap here. Copied verbatim, not re-derived.
env:
  NODE_OPTIONS: --max-old-space-size=8192

concurrency:
  group: cross-platform-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Advisory portability coverage. Linux remains the required PR platform.
  #
  # ★★★ SPLIT FROM ONE JOB INTO TWO, 2026-09-21 (M0 unit 2). The single job ran typecheck, the
  # WHOLE test suite and build under one 25-minute cap. macOS needs 1049s for `pnpm test:run`
  # alone (measured, run 35493290194) and Windows is consistently slower, so the Windows job was
  # killed by the cap on EVERY scheduled run. A timed-out job concludes `cancelled`, which rolls
  # the run to `cancelled` — which is why this lane produced NO cross-platform verdict at all for
  # the six weeks from 2026-08-16, and why the DEP-013 consumer reports it `not_success`.
  #
  # ★ THE CAP WAS NOT RAISED, DELIBERATELY. `pr.yml:1040-1041` states the rule for this repo:
  # "A PER-SHARD cap. Do NOT raise: a shard that still can't finish under it is a signal to shard
  # finer or to investigate a slow test, never to raise the cap (GO-BOOK §2.0)." So the tests are
  # sharded on the same axis the required Linux lane already uses, and typecheck/build stay in
  # their own job so they are not repeated once per shard.
  verify-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ★★★ REQUIRED BY TYPECHECK AND BY TESTS, not a convenience. Several workspace
      # packages are dist-only leaves that siblings import BY NAME, resolving through package
      # exports to ./dist -- so `tsc --noEmit` needs their .d.ts and vitest needs their .js,
      # and both run BEFORE `pnpm build`. Copied from the required Linux lane
      # (`pr.yml`, "Build dist-only leaves (required by typecheck + tests)"), which is the
      # proven recipe; do not let the two drift.
      #
      # ★ MEASURED, on run 35529720894: without this step BOTH new jobs went red --
      # typecheck with `error TS2307: Cannot find module '@armyofagents/worker-protocol'`
      # (sandbox-fake-provider/src/control-server.ts:24) and every test shard with
      # collection failures in the packages that import those leaves. The single job this
      # lane used to be won that race by side effect; a split job has its own fresh
      # checkout and wins nothing.
      - name: Build dist-only leaves (required by typecheck + tests)
        run: |
          pnpm --filter @armyofagents/worker-protocol build
          pnpm --filter @armyofagents/sandbox-fake-provider build
          pnpm --filter @armyofagents/worker-daemon build
          pnpm --filter @armyofagents/sandbox-provider-contract build
          pnpm --filter @armyofagents/sandbox-e2b-provider build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

  # The test suite, sharded so Windows can finish. Advisory like its sibling.
  test-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # A PER-SHARD cap, carrying the same rule as `pr.yml`'s: do NOT raise it. Derived, not
    # guessed — macOS's measured whole-suite work is 1049s, so a quarter of it is ~262s and this
    # leaves roughly 4x headroom for the slower Windows runner plus its install.
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ★★★ REQUIRED BY TYPECHECK AND BY TESTS, not a convenience. Several workspace
      # packages are dist-only leaves that siblings import BY NAME, resolving through package
      # exports to ./dist -- so `tsc --noEmit` needs their .d.ts and vitest needs their .js,
      # and both run BEFORE `pnpm build`. Copied from the required Linux lane
      # (`pr.yml`, "Build dist-only leaves (required by typecheck + tests)"), which is the
      # proven recipe; do not let the two drift.
      #
      # ★ MEASURED, on run 35529720894: without this step BOTH new jobs went red --
      # typecheck with `error TS2307: Cannot find module '@armyofagents/worker-protocol'`
      # (sandbox-fake-provider/src/control-server.ts:24) and every test shard with
      # collection failures in the packages that import those leaves. The single job this
      # lane used to be won that race by side effect; a split job has its own fresh
      # checkout and wins nothing.
      - name: Build dist-only leaves (required by typecheck + tests)
        run: |
          pnpm --filter @armyofagents/worker-protocol build
          pnpm --filter @armyofagents/sandbox-fake-provider build
          pnpm --filter @armyofagents/worker-daemon build
          pnpm --filter @armyofagents/sandbox-provider-contract build
          pnpm --filter @armyofagents/sandbox-e2b-provider build

      - name: Run tests (shard ${{ matrix.shard }}/4)
        # ★★★ `pnpm exec vitest run --shard=…`, NEVER `pnpm test:run -- --shard=…`.
        # `pr.yml:1102-1114` records the trap with its proof: pnpm 9.15.4 forwards the `--`
        # literally, so `pnpm test:run -- --shard=1/4` becomes `vitest run -- --shard=1/4`, the
        # flag is SILENTLY IGNORED and every shard runs the whole suite (run 33012727670: four
        # shards, ~52 min each, no split). A lane that shards four ways and still times out would
        # look like a slow runner rather than a swallowed flag.
        #
        # The denominator MUST equal the `shard` matrix length above (4): vitest partitions the
        # file set, so the four shards' union is exactly the full suite — nothing dropped, nothing
        # run twice.
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  # macOS runs the browser suite. Windows performs setup/build parity only
  # until its hosted runner can use an external/containerized PostgreSQL.
  e2e-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pin marketplace catalog fixture for stable e2e
        shell: bash
        run: cp tests/e2e/fixtures/marketplace-catalog.json ui/src/aoa-marketplace-snapshot.json

      - name: Install Playwright
        id: install-playwright
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install --only-shell chromium

      - name: Generate AoA config
        if: steps.install-playwright.outcome == 'success'
        shell: bash
        run: |
          mkdir -p ~/.aoa/instances/default
          cat > ~/.aoa/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        # Windows runner can't start embedded-postgres because its runneradmin
        # account is rejected by PostgreSQL. Keep setup/build parity there.
        if: steps.install-playwright.outcome == 'success' && matrix.os != 'windows-latest'
        env:
          AOA_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: steps.install-playwright.outcome == 'success' && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
