name: LLM Evals

on:
  pull_request:
    paths:
      - 'server/src/services/internal-agent/aoa-agents/**'
      - 'server/src/services/extraction.ts'
      - 'server/src/services/embeddings.ts'
      - 'server/src/eval/**'
      - 'server/src/__tests__/eval-*.test.ts'

# Allow only one concurrent eval run per PR — cancel the previous run
# when a new commit lands so we don't burn OpenAI budget on stale code.
concurrency:
  group: llm-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Run LLM eval suites
    runs-on: ubuntu-latest
    # Skip the job on PRs from forks — OPENAI_API_KEY is not available to
    # forked PRs by design, and running with no key would fail every llm-graded
    # fixture. Repo-internal PRs still run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run LLM eval suites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm eval:run
