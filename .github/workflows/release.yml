# Release workflow — Changesets action pattern (AoA deviation from Paperclip's custom CalVer).
#
# Flow:
#   1. Devs add `.changeset/*.md` files via `pnpm changeset` as part of PRs.
#   2. On push to main (or current porting branch), this workflow runs.
#   3. If unprocessed changesets exist, the action opens a "Version Packages" PR
#      aggregating them; that PR bumps versions + writes CHANGELOGs via
#      `pnpm version-packages` (= `changeset version`).
#   4. When the Version Packages PR merges, this workflow re-runs and the action
#      invokes `pnpm changeset publish` to publish to npm + create git tags +
#      draft GitHub Releases.
#
# Secrets required (configure in repo Settings → Secrets and variables → Actions):
#   - NPM_TOKEN: npm automation token with publish rights for @paperclipai/* packages.
#     Create at https://www.npmjs.com/settings/<user>/tokens (type: Automation).
#   - GITHUB_TOKEN: automatic, provided by Actions. No manual setup required.
#
# Note: `scripts/release.sh` remains the local-release escape hatch for one-shot
# patch/minor/major bumps outside this Changesets flow. It is NOT invoked from CI.

name: Release

on:
  push:
    branches:
      - master
      - main
      - Porting1.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
