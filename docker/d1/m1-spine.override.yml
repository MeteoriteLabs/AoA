# =============================================================================
# DEP-016 + DEP-019 — the `m1-spine` campaign profile's topology, as a compose OVERRIDE.
#
#   docker compose -f docker-compose.d1.yml -f docker/d1/m1-spine.override.yml up -d --wait
#
# It changes the base D1 stack and touches nothing else, so the existing two-worker merge train
# (`bounded` / `foundation`, which never passes this file) is unchanged:
#
#   1. ONE worker AND ONE control plane. `worker-a` and `control-plane-b` are moved into a profile
#      that nothing enables, so only `worker-b` and the single `control-plane` run — the topology
#      `M1-D1-SPINE` names: "one control-plane instance, one separately deployed worker"
#      (`docs/replatform/epic-regrooming/scope-triage.md`, Codex P1 on PR #566). A second replica
#      would let HA behaviour affect evidence presented as single-control-plane. `test-runner`'s
#      dependency list is replaced (`!override`) because a dependency on a service outside the
#      active profiles is a compose error.
#      ★ The S0-8 amendment — the rollout policy identical on BOTH replica blocks — is a CONFIG
#      claim and is unchanged: this file still carries it for `control-plane-b`, and the static
#      check still holds both blocks to the same byte-for-byte value, so the two agree the moment a
#      second replica is brought up.
#   2. The F10 TENANT SET, on EVERY control-plane replica, identically. Two Organizations are
#      `canary` (CLI-006: placement presents canary as `active`, so their attempts are
#      lease-eligible); the CONTROL Organization is absent, which the rollout source reads as
#      disabled. The value is the one `M1_SPINE_ROLLOUT_ENV_VALUE` in
#      `scripts/lib/m1-spine-assertions.mjs` builds — `evaluateSpineOverrideText` (pr.yml) holds
#      this file to it, and the live profile re-reads it from each replica's environment.
#   3. NOTHING about the crew switch. `AOA_DISTRIBUTED_CREW_ROLLOUT_ENABLED` is deployment-wide
#      with no per-Organization dimension, so arming it would arm crew for every enabled tenant at
#      once. The base file does not set it and neither does this one; the live profile asserts it
#      is unset or false on every replica (M1 plan §6, S0-8).
#
# ── DEP-019: the journey is WORKER-DRIVEN, and that is four more changes ──────
#
#   4. THE ONE DEPLOYED WORKER DISPATCHES. `worker-b` enters the networked container boot root
#      (`/worker-net-app/dist/bin/networked-host.js`, DEP-011 Slice 2b-ii), with
#      `AOA_WORKER_DISPATCH_ENABLED=1`, a durable event outbox and the DEP-017 env probe armed.
#      ★ SCOPED TO THIS FILE, exactly as DEP-015 scoped `checkDispatchDefaultOff` to its own
#      overlay. `docker-compose.d1.yml` and `scripts/d1-dispatch-expectation.json` are UNCHANGED,
#      so `check-d1-dispatch-declared` still holds BOTH base workers to ABSENT and still reds if
#      anyone sets the flag there. That guard parses only the base file, so the override's posture
#      would otherwise be covered by nothing — `evaluateSpineOverrideText` holds it instead, in
#      both directions.
#   5. ITS TARGET IS TENANT A'S. `worker-b` presents a committed, organization-scoped profile bound
#      to the first enabled spine Organization, and `migrate` seeds THAT profile's target and
#      authorizes THAT ticket — one artifact read twice, the WRK-017 shape, with the spine's own
#      pair of files. The worker gets its OWN state volume so a device identity minted on the
#      two-worker train can never be presented here.
#      ★ ONE deployed worker means ONE worker-driven tenant. Tenant B's journey stays
#      harness-driven and every one of its F10 properties is still asserted; the deployed worker
#      being offered NO work for B or for the control tenant is itself a cross-tenant case, with
#      A's own offer as its positive control. Recorded in DEP-019-result.md.
#   6. THE REFERENCE PROVIDER SERVES THE GATED WIRE. `fake-provider` opens a third port speaking
#      the adapter-manager's `POST /op/<op>`, over the fake's per-op `SandboxProvider`. The
#      shipped `bin/adapter-manager.ts` is untouched and stays `e2b`-only.
#   7. THE CONTROL PLANE MINTS THE RUN CAPABILITY. Without
#      `AOA_CONTROL_PLANE_SIGNING_KEY_FILE` the mint is inert, no `ownedLabelsCapability` rides the
#      secret-resolve reply, and every networked run terminates `no_run_capability` before create.
#      ★ THE KEYPAIR IS GENERATED BY THE JOB, NEVER COMMITTED. `docker/d1/runtime-keys/` is
#      git-ignored and created per run; neither half is printed, and a missing or non-ed25519 key
#      is a refusal to boot on both sides — never an ungated provider wire.
#      ★ THE KEY BOUNDARY, now held by a check. The private half is bound as an individual FILE into
#      the control plane ONLY, and the PUBLIC half as an individual FILE into the reference provider
#      ONLY; `evaluateSpineOverrideText` reds on a DIRECTORY mount of `runtime-keys` into any
#      service. History, because this record must not read as though it was always so: until
#      2026-09-23 both services mounted the whole directory, so the provider — the container that
#      also hosts the child-process probe path — did receive the private capability-minting key,
#      while this block claimed it received only the public half. Codex raised it (P1, PR #572); the
#      false claim was corrected first and the binds were fixed under the planning session's ruling.
#      ★ The evidence bundle is NOT scanned for these two values before upload — stated because this
#      block previously claimed it was. `collect-d1-evidence` gathers container logs, job events and
#      a SCHEMA-ONLY `pg_dump`, so neither value is captured today, but that is a property of what
#      the services happen to log rather than a control. Tracked in `DEP-019-result.md` §13.5.
#
# ONE-LINE JSON, single-quoted, on purpose: the static check compares it byte-for-byte.
# =============================================================================

services:
  migrate:
    # DEP-019 — seed the SPINE worker's target and authorize the SPINE ticket. The base file's
    # pair belongs to the two-worker train; the mount source here must equal the one `worker-b`
    # presents below, or the seed authorizes a code nothing presents.
    environment:
      AOA_D1_SEED_WORKER_PROFILE_FILE: "/seed-worker.profile.json"
      AOA_D1_SEED_ENROLMENT_TICKET_FILE: "/seed-enrolment-ticket"
    volumes:
      - "./docker/d1/m1-spine-worker.profile.json:/seed-worker.profile.json:ro"
      - "./docker/d1/m1-spine-worker.enrollment-ticket:/seed-enrolment-ticket:ro"

  control-plane:
    environment:
      AOA_DISTRIBUTED_EXECUTION_ROLLOUT: '{"organizations":{"0d016a00-0000-4000-8000-00000000000a":{"mode":"canary","workloads":["batch"]},"0d016b00-0000-4000-8000-00000000000b":{"mode":"canary","workloads":["batch"]}}}'
      # DEP-019 — the OwnedLabelsCapability mint. Generated per run into a git-ignored directory.
      AOA_CONTROL_PLANE_SIGNING_KEY_FILE: "/keys/control-plane-signing-key.pem"
      # DEP-019 — the secrets master key, GENERATED PER RUN and required (`:?`), never committed
      # and never defaulted. The journey's job carries one `env` / `sandbox_local_only` secret
      # handle, because the OwnedLabelsCapability only rides a RESOLVED handle's reply; resolving
      # it needs the Company secret store, and the store's key must be the same one the seed and
      # the server use. Without `:?` a missing value would silently mint a fresh key inside the
      # container and the seeded secret would decrypt nowhere.
      AOA_SECRETS_MASTER_KEY: "${AOA_D1_SPINE_SECRETS_MASTER_KEY:?the lane generates the per-run secrets master key}"
    volumes:
      # The PRIVATE half, and ONLY here. An individual FILE bind, never the directory (Codex P1).
      - "./docker/d1/runtime-keys/control-plane-signing-key.pem:/keys/control-plane-signing-key.pem:ro"

  control-plane-b:
    profiles: ["m1-spine-excluded"]
    environment:
      AOA_DISTRIBUTED_EXECUTION_ROLLOUT: '{"organizations":{"0d016a00-0000-4000-8000-00000000000a":{"mode":"canary","workloads":["batch"]},"0d016b00-0000-4000-8000-00000000000b":{"mode":"canary","workloads":["batch"]}}}'

  worker-a:
    profiles: ["m1-spine-excluded"]

  fake-provider:
    environment:
      # DEP-019 — the GATED provider wire. Arming the port without the PUBLIC key is a refusal to
      # boot (fake-provider-entry.mjs), because `createProviderServer` leaves create + execute on
      # raw, ungated handlers when its key is undefined.
      AOA_FAKE_PROVIDER_WIRE_PORT: "8082"
      AOA_FAKE_PROVIDER_CONTROL_PLANE_PUBLIC_KEY_FILE: "/keys/control-plane-public-key.pem"
    volumes:
      - "./tests/fixtures/distributed-execution:/fixtures:ro"
      # The PUBLIC half, and ONLY the public half. An individual FILE bind: mounting the DIRECTORY
      # handed this container the private capability-minting key as well, which matters more than
      # usual because this is also the container that hosts the child-process probe execution path
      # (Codex P1, PR #572). `evaluateSpineOverrideText` now reds on a directory mount of
      # `runtime-keys` into any service, so the boundary is held by a check and not by this comment.
      - "./docker/d1/runtime-keys/control-plane-public-key.pem:/keys/control-plane-public-key.pem:ro"

  worker-b:
    # DEP-019 — the NETWORKED container boot root. The base image CMD (`worker-daemon.js`) injects
    # no provider and is inert `no_provider`; the base compose's `container-host.js` override is
    # the custody path without one. This bin wraps that same custody path and adds the per-run
    # `makeRunProvider` factory over `AOA_WORKER_PROVIDER_URL`.
    command: ["node", "/worker-net-app/dist/bin/networked-host.js"]
    environment:
      AOA_WORKER_TARGET_PROFILE_ID: "d1-m1-spine-worker"
      AOA_WORKER_ENROLLMENT_CODE_FILE: "/enrollment-code"
      AOA_WORKER_DISPATCH_ENABLED: "1"
      # Dispatch refuses to compose without a durable outbox home (`no_event_outbox_path`).
      AOA_WORKER_EVENT_OUTBOX_PATH: "/worker/event-outbox.db"
      # DEP-017 — the live env-absence probe, armed. DEP-016 acceptance item 6.
      AOA_WORKER_ENV_PROBE: "1"
      # DEP-023 — the run-output REDACTION PROBE, armed. This is what makes the E5 audit matrix's
      # clause 5 observable: the reference provider echoes the run's redeemed credential under the
      # `AOA-RUN-OUTPUT-PROBE` tag, both captures scrub it, and the ONE surviving tagged line
      # reaches the run's event stream and this container's log carrying the scrubber's own marker.
      # Default OFF everywhere else — it is a redaction observation surface, not an output
      # mechanism (WRK-018 1(c), the open F7 ruling).
      AOA_WORKER_RUN_OUTPUT_PROBE: "1"
      AOA_WORKER_PROVIDER_URL: "http://fake-provider:8082"
    volumes:
      - "d1-spine-worker-state:/worker"
      - "./docker/d1/m1-spine-worker.profile.json:/profile.json:ro"
      - "./docker/d1/m1-spine-worker.enrollment-ticket:/enrollment-code:ro"

  test-runner:
    depends_on: !override
      control-plane:
        condition: service_healthy
      worker-b:
        condition: service_healthy
      fake-provider:
        condition: service_healthy

volumes:
  # DEP-019 — the spine worker's OWN durable identity home. Reusing `d1-worker-b-state` would let
  # a DeviceIdentityRecord minted against the two-worker train's target be presented here, which
  # the server denies as `worker_transfer_denied` forever and a container cannot reset.
  d1-spine-worker-state:
